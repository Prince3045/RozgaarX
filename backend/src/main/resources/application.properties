server.port=${PORT:8081}
spring.application.name=backend

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://rozgaarx.duckdns.org,https://rozgaarx.duckdns.org,http://13.51.247.128}

jwt.secret=${JWT_SECRET}
jwt.expirationMs=86400000

upload.dir=uploads/

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Java Mail Configuration
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:DEVELOPER_TEST}
spring.mail.password=${SPRING_MAIL_PASSWORD:DEVELOPER_TEST}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Admin UPI ID for payments
admin.upi.id=${ADMIN_UPI_ID:DEVELOPER_TEST}