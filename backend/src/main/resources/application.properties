server.port=${PORT:8081}
spring.application.name=backend

# SQLite Configuration (zero-install local database)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:rozgaarx.db}
spring.jpa.database-platform=${SPRING_JPA_DATABASE_PLATFORM:org.hibernate.community.dialect.SQLiteDialect}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}

allowed.origins=${ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://rozgaarx.duckdns.org,https://rozgaarx.duckdns.org,http://13.51.247.128}

